# Veröffentlicht nur landingpage.html als Startseite bei GitHub Pages.
# main.html wird bewusst NICHT veröffentlicht.
name: Landingpage veröffentlichen

on:
  push:
    branches: [main]
    paths:
      - landingpage.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur die Landingpage zusammenstellen
        run: |
          mkdir _site
          cp landingpage.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
