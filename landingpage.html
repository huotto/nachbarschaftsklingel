<script>
// ---------------------------------------------------------------------------
// window.storage-Ersatz: speichert lokal im Browser (localStorage) statt in
// der Claude-Umgebung. Gleiche Schnittstelle wie zuvor, damit der App-Code
// unverändert bleiben kann. "shared" wird ignoriert (alles ist lokal je Browser).
// ---------------------------------------------------------------------------
(function () {
  const PREFIX = "nachbarschaftsklingel-test:";

  window.storage = {
    async get(key) {
      const raw = localStorage.getItem(PREFIX + key);
      if (raw === null) throw new Error(`Schlüssel "${key}" nicht gefunden`);
      return { key, value: raw, shared: false };
    },
    async set(key, value) {
      localStorage.setItem(PREFIX + key, value);
      return { key, value, shared: false };
    },
    async delete(key) {
      const existed = localStorage.getItem(PREFIX + key) !== null;
      localStorage.removeItem(PREFIX + key);
      return { key, deleted: existed, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(PREFIX)) {
          const short = k.slice(PREFIX.length);
          if (!prefix || short.startsWith(prefix)) keys.push(short);
        }
      }
      return { keys, prefix, shared: false };
    },
  };
})();

        /* Schriften sind oben lokal eingebettet */

        :root {
          --bg-deep: #1c1a17;
          --bg-deep-2: #232019;
          --panel: #2b2823;
          --panel-edge: #37332b;
          --plate: #efe9da;
          --plate-dim: #e2dbc8;
          --ink: #2a2620;
          --ink-soft: #57503f;
          --brass: #c19552;
          --brass-bright: #d9ac68;
          --amber: #f0a83c;
          --amber-glow: rgba(240, 168, 60, 0.55);
          --muted: #a39a86;
          --muted-2: #6f6858;
          --danger: #c96a4f;
          --radius: 18px;
        }

        * { box-sizing: border-box; }

        .stage {
          min-height: 100vh;
          width: 100%;
          background:
            radial-gradient(ellipse at 50% -10%, #302c25 0%, var(--bg-deep) 55%),
            repeating-linear-gradient(180deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
          font-family: 'Karla', sans-serif;
          color: var(--plate);
          display: flex;
          justify-content: center;
          padding: 28px 16px 60px;
        }

        .panel-frame {
          width: 100%;
          max-width: 460px;
        }

        .header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
          margin-bottom: 18px;
          padding: 0 4px;
        }
        .header.header-sticky {
          margin: 0 -16px 18px;
          padding: 12px 16px;
          position: sticky;
          top: 0;
          z-index: 30;
          background: rgba(28,26,23,0.28);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
        }

        .brand {
          font-family: 'Oswald', sans-serif;
          text-transform: uppercase;
          letter-spacing: 0.14em;
          font-size: 13px;
          color: var(--muted);
          min-width: 0;
          overflow: hidden;
          text-overflow: ellipsis;
          white-space: nowrap;
        }
        .brand b { color: var(--brass-bright); }

        .nk-back-btn {
          display: flex; align-items: center; gap: 6px;
          background: var(--danger);
          border: 1px solid var(--danger);
          color: var(--plate);
          padding: 8px 10px;
          border-radius: 999px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          flex-shrink: 0;
          white-space: nowrap;
          cursor: pointer;
          transition: filter .2s;
        }
        .nk-back-btn:hover { filter: brightness(1.1); }
        .nk-back-btn:active { transform: scale(0.96); }
        .nk-back-btn:disabled { opacity: 0.4; cursor: default; transform: none; filter: none; }
        .nk-back-label { display: inline; }
        @media (min-width: 820px) {
          .nk-back-label { display: inline; }
        }

        .bell-btn {
          position: relative;
          display: flex; align-items: center; gap: 6px;
          background: var(--panel);
          border: 1px solid var(--panel-edge);
          color: var(--plate-dim);
          padding: 8px 12px;
          border-radius: 999px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 12px;
          flex-shrink: 0;
          white-space: nowrap;
          cursor: pointer;
          transition: border-color .2s, color .2s;
        }
        .bell-btn:hover { border-color: var(--brass); color: var(--brass-bright); }

        .bell-btn-label { display: none; }
        @media (min-width: 820px) {
          .bell-btn-label { display: inline; }
        }
        .nk-badge {
          position: absolute; top: -6px; right: -6px;
          background: var(--danger); color: #fff;
          min-width: 18px; height: 18px; border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700;
          padding: 0 4px; line-height: 1; border: 2px solid var(--bg-deep);
        }
        .bell-btn.nk-active {
          border-color: var(--amber);
          color: var(--amber);
        }

        .panel {
          background: linear-gradient(160deg, var(--panel) 0%, var(--bg-deep-2) 100%);
          border: 1px solid var(--panel-edge);
          border-radius: var(--radius);
          padding: 22px 18px 26px;
          position: relative;
          box-shadow: 0 30px 60px -25px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
        }
        .panel::before, .panel::after {
          content: ''; position: absolute; width: 6px; height: 6px; border-radius: 50%;
          background: radial-gradient(circle at 35% 35%, #6b6255, #2a2620);
          box-shadow: inset 0 0 1px rgba(0,0,0,0.6);
        }
        .panel::before { top: 12px; left: 12px; }
        .panel::after { top: 12px; right: 12px; }

        .panel-title {
          font-family: 'Oswald', sans-serif;
          font-size: 22px;
          letter-spacing: 0.04em;
          font-weight: 600;
          color: var(--plate);
          margin: 4px 0 2px;
        }
        .panel-sub {
          color: var(--muted);
          font-size: 13.5px;
          margin-bottom: 18px;
        }

        .back-row {
          display: flex; align-items: center; gap: 8px;
          color: var(--amber); font-size: 13px; cursor: pointer;
          margin-bottom: 14px; width: fit-content;
          font-family: 'JetBrains Mono', monospace;
          letter-spacing: 0.02em;
          transition: color .2s;
        }
        .back-row:hover { color: var(--brass-bright); }

        .plate-list { display: flex; flex-direction: column; gap: 10px; }

        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 10px; }
        .profile-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media (min-width: 620px) {
          .profile-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (min-width: 620px) {
          .panel-frame { max-width: min(92vw, 1000px); }
        }

        .search-box {
          display: flex; align-items: center; gap: 8px;
          background: var(--bg-deep-2); border: 1px solid var(--panel-edge);
          border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
          transition: border-color .15s;
        }
        .search-box:focus-within { border-color: var(--brass); }
        .search-icon { color: var(--muted); flex-shrink: 0; }
        .search-input {
          flex: 1; background: transparent; border: none; color: var(--plate);
          font-family: 'Karla', sans-serif; font-size: 13.5px; outline: none;
        }
        .search-input::placeholder { color: var(--muted-2); }
        .search-clear {
          border: none; background: transparent; color: var(--muted); cursor: pointer;
          display: flex; align-items: center; padding: 2px;
        }
        .search-clear:hover { color: var(--brass-bright); }
        .nk-fav-btn {
          width: 100%; display: flex; align-items: center; gap: 10px;
          text-align: left; margin-bottom: 16px;
        }

        .plate-row {
          display: flex; align-items: center; gap: 14px;
          background: var(--plate);
          border-radius: 10px;
          padding: 14px 14px;
          cursor: pointer;
          border: 1px solid var(--plate-dim);
          box-shadow: 0 2px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
          transition: transform .15s ease, box-shadow .15s ease;
          text-align: left;
        }
        .plate-row:hover { transform: translateX(2px); }
        .plate-row:active { transform: translateY(1px); box-shadow: 0 0 0 rgba(0,0,0,0.25); }

        .plate-icon {
          position: relative;
          width: 40px; height: 40px; border-radius: 50%;
          background: var(--ink);
          color: var(--brass-bright);
          display: flex; align-items: center; justify-content: center;
          flex-shrink: 0;
          border: 1px solid #3a3427;
        }

        .plate-text { flex: 1; min-width: 0; }
        .plate-name {
          font-family: 'Oswald', sans-serif;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          font-size: 15px;
          color: var(--ink);
          font-weight: 600;
        }
        .nk-unread-dot {
          position: absolute; top: -6px; right: -6px;
          min-width: 18px; height: 18px; border-radius: 50%;
          background: var(--danger); border: 2px solid var(--plate); color: #fff;
          display: flex; align-items: center; justify-content: center;
          font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; padding: 0 3px;
       
          transition: opacity .6s ease;
        }
        .nk-unread-dot.nk-dot-hidden { opacity: 0; }
        .plate-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

        .plate-arrow { color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; font-size: 16px; }

        .provider-plate {
          display: flex; align-items: center; gap: 14px;
          background: var(--plate);
          border-radius: 10px;
          padding: 14px;
          border: 1px solid var(--plate-dim);
          box-shadow: 0 2px 0 rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.5);
        }
        .provider-plate.own-service-plate { border: 1px dashed var(--brass); }
        .provider-plate-wrap { display: flex; flex-direction: column; gap: 10px; }
        .provider-plate-btn { width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
        .nk-request-list {
          max-height: 0; opacity: 0; overflow: hidden;
          padding-left: 26px;
          transition: max-height .9s ease, opacity .9s ease;
        }
        .nk-request-list.open { max-height: 260px; opacity: 1; }
        .nk-request-inner { overflow: hidden; min-height: 0; }

        .nk-info-box {
          background: var(--bg-deep-2); border: 1px solid var(--panel-edge);
          border-radius: 14px; padding: 4px 16px;
        }
        .nk-info-row {
          display: flex; align-items: center; justify-content: space-between; gap: 12px;
          padding: 12px 0; border-bottom: 1px solid var(--panel-edge);
          font-size: 13.5px; color: var(--muted);
        }
        .nk-info-val {
          color: var(--plate); font-weight: 600;
          font-family: 'JetBrains Mono', monospace; text-align: right;
        }
        .nk-info-desc {
          color: var(--plate-dim); font-size: 13.5px; line-height: 1.55; padding: 12px 0 14px;
        }

        .own-tag { color: var(--brass) !important; font-weight: 600; }
        .own-badge {
          flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 10.5px;
          color: var(--brass); text-align: right; max-width: 90px; line-height: 1.3;
        }
        .avatar {
          width: 46px; height: 46px; border-radius: 50%;
          background: var(--ink); color: var(--brass-bright);
          display: flex; align-items: center; justify-content: center;
          font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 15px;
          flex-shrink: 0; border: 1px solid #3a3427; overflow: hidden;
        }
        .avatar { position: relative; }
        .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
        .avatar.avatar-lg { width: 64px; height: 64px; font-size: 19px; }

        .profile-avatar-row { display: flex; justify-content: center; margin-bottom: 10px; }
        .profile-name-heading {
          text-align: center; font-family: 'Oswald', sans-serif; text-transform: uppercase;
          letter-spacing: 0.05em; font-size: 17px; color: var(--plate); margin-bottom: 18px;
        }

        .avatar-picker { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
        .avatar-picker-actions { display: flex; flex-direction: column; align-items: flex-start; }
        .avatar-upload-btn {
          width: auto; margin-top: 0; display: inline-block; cursor: pointer; text-align: center; white-space: nowrap;
          font-size: 11.5px; padding: 9px 12px;
        }
        .avatar-upload-btn input[type="file"] { display: none; }

        .rating-row { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 12px; color: var(--ink-soft); font-family: 'JetBrains Mono', monospace; }

        .ring-btn {
          border: none; cursor: pointer;
          background: linear-gradient(180deg, var(--brass-bright), var(--brass));
          color: #241f16;
          font-family: 'Oswald', sans-serif;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          font-weight: 600;
          font-size: 12.5px;
          padding: 10px 14px;
          border-radius: 8px;
          display: flex; align-items: center; gap: 6px;
          flex-shrink: 0;
          box-shadow: 0 2px 0 rgba(0,0,0,0.3);
          transition: filter .15s, transform .1s;
        }
        .ring-btn:hover { filter: brightness(1.08); }
        .ring-btn:active { transform: translateY(1px); }

        .buzz-overlay {
          position: fixed; inset: 0; background: rgba(20,18,14,0.75);
          display: flex; align-items: center; justify-content: center;
          z-index: 50; backdrop-filter: blur(2px);
        }
        .buzz-core {
          width: 96px; height: 96px; border-radius: 50%;
          background: radial-gradient(circle, var(--amber) 0%, #b5731f 70%);
          box-shadow: 0 0 0 0 var(--amber-glow);
          animation: pulse 0.9s ease-in-out infinite;
          display: flex; align-items: center; justify-content: center;
          color: #241f16;
        }
        @keyframes pulse {
          0% { box-shadow: 0 0 0 0 var(--amber-glow); }
          70% { box-shadow: 0 0 0 22px rgba(240,168,60,0); }
          100% { box-shadow: 0 0 0 0 rgba(240,168,60,0); }
        }
        .buzz-label {
          position: absolute; margin-top: 130px;
          font-family: 'JetBrains Mono', monospace;
          color: var(--plate-dim); font-size: 13px; letter-spacing: 0.04em;
        }

        .avatar-editor-overlay {
          position: fixed; inset: 0; background: rgba(20,18,14,0.8);
          display: flex; align-items: center; justify-content: center;
          z-index: 60; padding: 20px;
        }
        .avatar-editor-box {
          background: linear-gradient(160deg, var(--panel) 0%, var(--bg-deep-2) 100%);
          border: 1px solid var(--panel-edge); border-radius: var(--radius);
          padding: 22px; width: 100%; max-width: 320px; text-align: center;
        }
        .avatar-editor-title {
          font-family: 'Oswald', sans-serif; text-transform: uppercase; letter-spacing: 0.05em;
          font-size: 15px; color: var(--plate); margin-bottom: 4px;
        }
        .avatar-editor-hint { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
        .avatar-editor-canvas-wrap {
          width: 220px; height: 220px; border-radius: 50%; overflow: hidden;
          margin: 0 auto 18px; border: 2px solid var(--brass);
          cursor: grab; touch-action: none; background: var(--bg-deep-2);
        }
        .avatar-editor-canvas-wrap:active { cursor: grabbing; }
        .avatar-editor-canvas-wrap canvas { display: block; width: 100%; height: 100%; }
        .avatar-editor-zoom-row {
          display: flex; align-items: center; gap: 10px; margin-bottom: 18px; color: var(--muted);
        }
        .avatar-editor-zoom-row input[type="range"] { flex: 1; accent-color: var(--brass); }
        .avatar-editor-actions { display: flex; gap: 10px; }
        .avatar-editor-actions .primary-btn, .avatar-editor-actions .secondary-btn { margin-top: 0; flex: 1; }

        .detail-card {
          background: var(--plate); color: var(--ink); border-radius: 12px;
          padding: 18px; margin-top: 14px;
          border: 1px solid var(--plate-dim);
        }
        .detail-name { font-family: 'Oswald', sans-serif; font-size: 20px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
        .detail-tagline { color: var(--ink-soft); font-size: 13.5px; margin-top: 2px; }
